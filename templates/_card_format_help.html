<p class="editor-help" id="{{ format_help_id }}">
    Use Enter or <code>\n</code> for a line break, and a blank line or <code>\n\n</code> for a paragraph.
    Type bullets such as <code>•</code> as ordinary text. To show an image, put an HTTPS image URL
    ending in <code>.png</code>, <code>.jpg</code> or another image extension on its own line,
    or use <code>![description](https://…)</code>.
</p>
