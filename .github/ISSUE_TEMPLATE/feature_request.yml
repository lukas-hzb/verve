name: Feature request
description: Suggest a focused improvement to Verve's vocabulary-learning workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the learning problem first. A clear use case makes it easier to evaluate the right solution.
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What is difficult or impossible in the current workflow?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed workflow
      description: Explain how the feature should behave from a learner's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or related references when useful.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a similar proposal.
          required: true
        - label: The request is focused on vocabulary learning or spaced repetition.
          required: true
